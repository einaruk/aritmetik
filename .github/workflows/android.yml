name: android

# main'e her push'ta imzalı APK derler ve "android" sürümüne koyar.
# İndirme linki hep aynı kalır:
# https://github.com/einaruk/aritmetik/releases/download/android/aritmetik.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - name: İmza anahtarı
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret'ı yok; README'deki Android imza adımına bak."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aritmetik.p12"
      - name: APK derle
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/aritmetik.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: İmzayı doğrula
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          cp "$APK" aritmetik.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aritmetik-apk
          path: aritmetik.apk
          retention-days: 30
      - name: Sürümü güncelle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --cleanup-tag --yes || true
          gh release create android aritmetik.apk \
            --target "$GITHUB_SHA" \
            --title "Android uygulaması" \
            --notes "Telefonda bu sayfadan aritmetik.apk dosyasını indirip aç. Kurulum adımları README'de. Derleme: ${GITHUB_SHA::7}, sürüm 1.0.${GITHUB_RUN_NUMBER}."
